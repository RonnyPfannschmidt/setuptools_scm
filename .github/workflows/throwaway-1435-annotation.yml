# Throwaway: exercises the pypa/setuptools-scm#1435 annotation. Not for merging.
name: throwaway 1435 annotation smoke

on:
  pull_request:

permissions: {}

jobs:
  annotate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: context
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: in-process CLI, annotation on stderr
        run: |
          python -m pip install -q ./vcs-versioning
          python -m vcs_versioning --root . -f json

      - name: python -m build --sdist vcs-versioning
        run: |
          python -m pip install -q build
          python -m build --sdist vcs-versioning 2>&1 | tee build.log
          echo "annotation lines: $(grep -c '^::warning' build.log || true)"

      - name: uv build --sdist vcs-versioning
        run: |
          uv build --sdist --package vcs-versioning -o uv-dist 2>&1 | tee uv.log
          echo "annotation lines: $(grep -c '^::warning' uv.log || true)"

      - name: pip wheel -v vcs-versioning
        run: |
          python -m pip wheel -v --no-deps ./vcs-versioning -w pip-dist 2>&1 | tee pip.log
          echo "annotation lines: $(grep -c '::warning' pip.log || true)"
